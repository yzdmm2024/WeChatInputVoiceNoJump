name: Build Deb (Theos)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    # macos-13 (Intel) 上 /usr/local 对 runner 用户可写；
    # macos-latest 已切到 arm64，/usr/local 归 root 且不可写，
    # 导致 theos-action 缓存解包 gtar 报 Permission denied 而构建失败。
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Build package (rootless)
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: WxKbNoJump-deb
          path: packages/*.deb
          if-no-files-found: error